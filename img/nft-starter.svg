<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="Стартовый набор NFT: Мурзик, Гагарин и Серия-10">
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#00d2c6"/>
    </linearGradient>
    <radialGradient id="stglow" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#00d2c6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00d2c6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- фон -->
  <rect width="660" height="340" rx="20" fill="#0f1526"/>
  <rect width="660" height="340" rx="20" fill="url(#stglow)"/>
  <rect x="231" y="26" width="198" height="252" rx="26" fill="url(#mglow)"/>

  <!-- искры -->
  <circle cx="205" cy="52" r="2" fill="#00d2c6" opacity="0.55"/>
  <circle cx="60" cy="36" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="600" cy="48" r="2" fill="#00d2c6" opacity="0.5"/>
  <circle cx="630" cy="120" r="1.5" fill="#8b7bff" opacity="0.55"/>
  <circle cx="40" cy="300" r="2" fill="#8b7bff" opacity="0.45"/>
  <circle cx="620" cy="300" r="2" fill="#ffffff" opacity="0.35"/>

  <!-- карточка 1: Мурзик -->
  <g transform="translate(42 68) rotate(-7 85 113)">
    <rect width="170" height="226" rx="18" fill="#151d33" stroke="#2f3a63" stroke-width="1.5"/>
    <rect x="10" y="10" width="150" height="120" rx="12" fill="#0d1222"/>
    <g transform="translate(85 68)">
      <path d="M-34 -16 L-26 -44 L-9 -29 Z" fill="#8b7bff"/>
      <path d="M34 -16 L26 -44 L9 -29 Z" fill="#8b7bff"/>
      <circle cx="0" cy="4" r="30" fill="#8b7bff"/>
      <circle cx="-10" cy="-2" r="4" fill="#0a0e1a"/>
      <circle cx="10" cy="-2" r="4" fill="#0a0e1a"/>
      <path d="M-5 9 L5 9 L0 15 Z" fill="#0a0e1a"/>
      <path d="M0 15 q-5 6 -10 4 M0 15 q5 6 10 4" stroke="#0a0e1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="85" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e8ecf7">Мурзик</text>
    <text x="85" y="177" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9aa5c0">#001</text>
    <rect x="50" y="188" width="70" height="22" rx="11" fill="#1c2542"/>
    <text x="85" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#9aa5c0">Обычная</text>
  </g>

  <!-- карточка 2: Гагарин (редкая, с градиентной рамкой) -->
  <g transform="translate(245 40)">
    <rect width="170" height="226" rx="18" fill="#151d33" stroke="url(#ga)" stroke-width="2"/>
    <rect x="10" y="10" width="150" height="120" rx="12" fill="#0d1222"/>
    <g transform="translate(85 68)">
      <path d="M-8 25 L0 50 L8 25 Z" fill="#ffd166"/>
      <path d="M-23 2 L-40 27 L-21 21 Z" fill="#6c5ce7"/>
      <path d="M23 2 L40 27 L21 21 Z" fill="#6c5ce7"/>
      <path d="M0 -42 C16 -26 22 -6 22 16 L-22 16 C-22 -6 -16 -26 0 -42 Z" fill="#d7dcef"/>
      <circle cx="0" cy="-8" r="10" fill="#0a0e1a"/>
      <circle cx="0" cy="-8" r="6.5" fill="#00d2c6"/>
      <rect x="-18" y="16" width="36" height="9" rx="4" fill="#8b7bff"/>
    </g>
    <text x="85" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e8ecf7">Гагарин</text>
    <text x="85" y="177" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9aa5c0">#042</text>
    <rect x="57" y="188" width="56" height="22" rx="11" fill="#2a2650"/>
    <text x="85" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#a99dff">Редкая</text>
  </g>

  <!-- карточка 3: Серия-10 (легендарная) -->
  <g transform="translate(448 68) rotate(7 85 113)">
    <rect width="170" height="226" rx="18" fill="#151d33" stroke="#2f3a63" stroke-width="1.5"/>
    <rect x="10" y="10" width="150" height="120" rx="12" fill="#0d1222"/>
    <g transform="translate(85 70)">
      <path d="M-22 -28 L22 -28 L22 -8 C22 4 13 12 0 12 C-13 12 -22 4 -22 -8 Z" fill="#ffd166"/>
      <path d="M-22 -22 C-37 -22 -37 -6 -21 -4" stroke="#ffd166" stroke-width="5" fill="none"/>
      <path d="M22 -22 C37 -22 37 -6 21 -4" stroke="#ffd166" stroke-width="5" fill="none"/>
      <rect x="-4" y="12" width="8" height="12" fill="#ffd166"/>
      <rect x="-15" y="24" width="30" height="8" rx="3" fill="#ffd166"/>
      <text x="0" y="-14" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0a0e1a">10</text>
    </g>
    <text x="85" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e8ecf7">Серия-10</text>
    <text x="85" y="177" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9aa5c0">#077</text>
    <rect x="42" y="188" width="86" height="22" rx="11" fill="#33290f"/>
    <text x="85" y="203" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#ffd166">Легендарная</text>
  </g>
</svg>
