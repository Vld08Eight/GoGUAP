<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-label="Телефон с QR-сканером GoGUAP и NFT-карточки">
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#00d2c6"/>
    </linearGradient>
    <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2342"/>
      <stop offset="1" stop-color="#111830"/>
    </linearGradient>
    <radialGradient id="gg" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#6c5ce7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- фоновое свечение -->
  <rect width="560" height="620" rx="28" fill="url(#gg)"/>

  <!-- левая карточка: кот Мурзик -->
  <g transform="translate(14 158) rotate(-7 84 112)">
    <rect width="168" height="224" rx="18" fill="#151d33" stroke="#2f3a63" stroke-width="1.5"/>
    <rect x="10" y="10" width="148" height="130" rx="12" fill="#0d1222"/>
    <g transform="translate(84 74)">
      <path d="M-36 -16 L-28 -46 L-10 -30 Z" fill="#8b7bff"/>
      <path d="M36 -16 L28 -46 L10 -30 Z" fill="#8b7bff"/>
      <circle cx="0" cy="4" r="32" fill="#8b7bff"/>
      <circle cx="-11" cy="-2" r="4.5" fill="#0a0e1a"/>
      <circle cx="11" cy="-2" r="4.5" fill="#0a0e1a"/>
      <path d="M-5 10 L5 10 L0 16 Z" fill="#0a0e1a"/>
      <path d="M0 16 q-5 7 -11 5 M0 16 q5 7 11 5" stroke="#0a0e1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="84" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e8ecf7">Мурзик</text>
    <text x="84" y="184" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9aa5c0">#001 · обычная</text>
    <rect x="42" y="196" width="84" height="8" rx="4" fill="#1c2542"/>
    <rect x="42" y="196" width="34" height="8" rx="4" fill="#00d2c6"/>
  </g>

  <!-- правая карточка: Гагарин -->
  <g transform="translate(380 200) rotate(7 85 113)">
    <rect width="170" height="226" rx="18" fill="#151d33" stroke="#2f3a63" stroke-width="1.5"/>
    <rect x="10" y="10" width="150" height="130" rx="12" fill="#0d1222"/>
    <g transform="translate(85 70)">
      <path d="M-8 27 L0 52 L8 27 Z" fill="#ffd166"/>
      <path d="M-23 4 L-41 30 L-21 24 Z" fill="#6c5ce7"/>
      <path d="M23 4 L41 30 L21 24 Z" fill="#6c5ce7"/>
      <path d="M0 -44 C16 -28 23 -8 23 16 L-23 16 C-23 -8 -16 -28 0 -44 Z" fill="#d7dcef"/>
      <circle cx="0" cy="-8" r="11" fill="#0a0e1a"/>
      <circle cx="0" cy="-8" r="7" fill="#00d2c6"/>
      <rect x="-19" y="16" width="38" height="9" rx="4" fill="#8b7bff"/>
    </g>
    <text x="85" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e8ecf7">Гагарин</text>
    <text x="85" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9aa5c0">#042 · редкая</text>
    <rect x="43" y="198" width="84" height="8" rx="4" fill="#1c2542"/>
    <rect x="43" y="198" width="62" height="8" rx="4" fill="#6c5ce7"/>
  </g>

  <!-- искры -->
  <circle cx="95" cy="52" r="2" fill="#00d2c6" opacity="0.6"/>
  <circle cx="140" cy="86" r="1.5" fill="#ffffff" opacity="0.45"/>
  <circle cx="452" cy="110" r="2.5" fill="#00d2c6" opacity="0.6"/>
  <circle cx="508" cy="78" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="520" cy="150" r="1.5" fill="#8b7bff" opacity="0.6"/>
  <circle cx="36" cy="560" r="2" fill="#8b7bff" opacity="0.5"/>
  <circle cx="515" cy="555" r="2" fill="#00d2c6" opacity="0.45"/>
  <circle cx="250" cy="600" r="1.5" fill="#ffffff" opacity="0.35"/>

  <!-- телефон -->
  <g transform="translate(170 32)">
    <rect width="240" height="500" rx="36" fill="#0a0e1a" stroke="#2f3a63" stroke-width="2"/>
    <rect x="12" y="12" width="216" height="476" rx="26" fill="url(#gs)"/>
    <rect x="92" y="28" width="56" height="10" rx="5" fill="#232e4d"/>

    <text x="28" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#e8ecf7">GoGUAP</text>
    <circle cx="200" cy="76" r="13" fill="url(#ga)"/>

    <!-- видоискатель QR-сканера -->
    <rect x="36" y="104" width="168" height="168" rx="14" fill="#0a0e1a"/>
    <path d="M36 130 L36 118 Q36 104 50 104 L62 104" stroke="url(#ga)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M178 104 L190 104 Q204 104 204 118 L204 130" stroke="url(#ga)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M204 246 L204 258 Q204 272 190 272 L178 272" stroke="url(#ga)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M62 272 L50 272 Q36 272 36 258 L36 246" stroke="url(#ga)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- QR-код -->
    <rect x="56" y="124" width="128" height="128" rx="8" fill="#e8ecf7"/>
    <rect x="64" y="132" width="36" height="36" rx="5" fill="#0a0e1a"/>
    <rect x="71" y="139" width="22" height="22" rx="3" fill="#e8ecf7"/>
    <rect x="76" y="144" width="12" height="12" rx="2" fill="#0a0e1a"/>
    <rect x="140" y="132" width="36" height="36" rx="5" fill="#0a0e1a"/>
    <rect x="147" y="139" width="22" height="22" rx="3" fill="#e8ecf7"/>
    <rect x="152" y="144" width="12" height="12" rx="2" fill="#0a0e1a"/>
    <rect x="64" y="208" width="36" height="36" rx="5" fill="#0a0e1a"/>
    <rect x="71" y="215" width="22" height="22" rx="3" fill="#e8ecf7"/>
    <rect x="76" y="220" width="12" height="12" rx="2" fill="#0a0e1a"/>
    <g fill="#0a0e1a">
      <rect x="106" y="140" width="12" height="12" rx="2"/>
      <rect x="126" y="152" width="10" height="10" rx="2"/>
      <rect x="106" y="168" width="10" height="10" rx="2"/>
      <rect x="126" y="184" width="12" height="12" rx="2"/>
      <rect x="106" y="196" width="10" height="10" rx="2"/>
      <rect x="72" y="176" width="10" height="10" rx="2"/>
      <rect x="96" y="176" width="12" height="12" rx="2"/>
      <rect x="144" y="176" width="10" height="10" rx="2"/>
      <rect x="164" y="184" width="10" height="10" rx="2"/>
      <rect x="108" y="212" width="12" height="12" rx="2"/>
      <rect x="132" y="220" width="10" height="10" rx="2"/>
      <rect x="156" y="212" width="12" height="12" rx="2"/>
      <rect x="156" y="236" width="10" height="10" rx="2"/>
    </g>

    <!-- линия сканирования -->
    <rect x="46" y="182" width="148" height="8" rx="4" fill="#00d2c6" opacity="0.25"/>
    <rect x="46" y="185" width="148" height="4" rx="2" fill="#00d2c6"/>

    <!-- кнопка отметки -->
    <rect x="36" y="300" width="168" height="46" rx="12" fill="url(#ga)"/>
    <text x="120" y="329" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Отметиться на паре</text>

    <!-- мини-награды -->
    <text x="36" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9aa5c0">Мои награды</text>
    <g transform="translate(36 394)">
      <rect width="52" height="52" rx="12" fill="#1a2342" stroke="#2f3a63"/>
      <path d="M18 18 L21 10 L26 15 Z" fill="#8b7bff"/>
      <path d="M34 18 L31 10 L26 15 Z" fill="#8b7bff"/>
      <circle cx="26" cy="28" r="12" fill="#8b7bff"/>
      <circle cx="22" cy="26" r="2" fill="#0a0e1a"/>
      <circle cx="30" cy="26" r="2" fill="#0a0e1a"/>
    </g>
    <g transform="translate(36 394)">
      <rect x="64" width="52" height="52" rx="12" fill="#1a2342" stroke="#2f3a63"/>
      <path d="M90 16 L92.6 23.4 L100.5 23.6 L94.3 28.4 L96.5 35.9 L90 31.5 L83.5 35.9 L85.7 28.4 L79.5 23.6 L87.4 23.4 Z" fill="#ffd166"/>
    </g>
    <g transform="translate(36 394)">
      <rect x="128" width="52" height="52" rx="12" fill="#1a2342" stroke="#2f3a63"/>
      <path d="M150 36 L154 46 L158 36 Z" fill="#ffd166"/>
      <path d="M154 12 C161 18 164 26 164 34 L144 34 C144 26 147 18 154 12 Z" fill="#d7dcef"/>
      <circle cx="154" cy="26" r="4" fill="#00d2c6"/>
    </g>

    <rect x="36" y="460" width="168" height="4" rx="2" fill="#232e4d"/>
  </g>
</svg>
